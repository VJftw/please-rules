name: Nightly

# Refreshes every plugin's checksum mirrors (its generated
# `build_defs/*versions.build_defs` - see .github/scripts/mirrors/ and each
# plugin's README's Checksum mirror section), so newly released tool versions
# work without explicit hashes.
#
# Every plugin's mirrors are refreshed in parallel (one `update` job each),
# then all of their changes go into a single pull request, `chore: update
# version mirrors`, on the `nightly/version-mirrors` branch - including the
# patch version bump and registry/ entry that title implies for each changed
# plugin (see .github/scripts/registry.nu), so they're released as soon as it
# merges. The next night's run updates that same pull request (or closes it,
# if the changes have landed some other way), rather than opening another
# one.
#
# Pull requests opened with the default GITHUB_TOKEN don't trigger other
# workflows, so CI (ci.yml, registry.yml) wouldn't run on them. To have it
# run, create a GitHub App with Contents and Pull requests read/write access,
# install it on this repository, and set its ID as the NIGHTLY_APP_ID
# repository variable and its private key as the NIGHTLY_APP_PRIVATE_KEY
# repository secret - this then opens the pull requests as that App instead.
# Without it, this still works (as long as "Allow GitHub Actions to create
# and approve pull requests" is enabled in the repository's Actions
# settings), but CI only runs once someone else pushes to the pull request.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: nushell
            mirrors: nushell
          - plugin: plantuml
            mirrors: plantuml
          - plugin: opa
            mirrors: opa
          - plugin: hugo
            mirrors: hugo
          - plugin: k8s
            mirrors: kustomize helm kubectl
          - plugin: terraform
            mirrors: terraform
    runs-on: ubuntu-latest
    # The mirrors only look up releases published since the last refresh, so
    # this is normally quick - but one that has to verify a lot of new
    # releases at once can take a while.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-please

      # The kubectl mirror verifies new releases' sigstore signatures.
      - uses: sigstore/cosign-installer@v3
        if: matrix.plugin == 'k8s'

      - name: Run ${{ matrix.plugin }}'s mirror scripts
        working-directory: .github
        env:
          # Read-only use of the GitHub API (listing releases) - without it,
          # requests are rate limited to 60 an hour, shared by every job on
          # the runner's IP.
          GITHUB_TOKEN: ${{ github.token }}
          MIRRORS: ${{ matrix.mirrors }}
        run: |
          set -euo pipefail
          for mirror in $MIRRORS; do
            echo "::group::${mirror}"
            plz run "//scripts/mirrors:${mirror}"
            echo "::endgroup::"
          done

      # Handed to the pull-request job below as a patch - only if there's
      # anything in it.
      - name: Save ${{ matrix.plugin }}'s changes
        id: diff
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          git add -- "$PLUGIN"
          if git diff --cached --quiet -- "$PLUGIN"; then
            echo "${PLUGIN}: mirrors are up to date"
          else
            git diff --cached --stat -- "$PLUGIN"
            git diff --cached --binary -- "$PLUGIN" >"$RUNNER_TEMP/${PLUGIN}.patch"
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          name: mirrors-${{ matrix.plugin }}
          path: ${{ runner.temp }}/${{ matrix.plugin }}.patch
          retention-days: 1

  pull-request:
    needs: update
    # Still opens a pull request with every other plugin's changes if one
    # plugin's mirrors failed - that one's are picked up again the next night.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so registry.nu can find where the change diverged
          # from main.
          fetch-depth: 0
      - uses: ./.github/actions/setup-please

      - uses: actions/download-artifact@v4
        with:
          pattern: mirrors-*
          merge-multiple: true
          path: ${{ runner.temp }}/patches

      - name: Bump every changed plugin's version and registry entry
        id: bump
        env:
          TITLE: "chore: update version mirrors"
          PATCHES: ${{ runner.temp }}/patches
        run: |
          set -euo pipefail
          for patch in "$PATCHES"/*.patch; do
            [ -e "$patch" ] || continue
            git apply --index "$patch"
          done
          plugins=""
          if git diff --cached --quiet; then
            echo "All mirrors are up to date"
          else
            git diff --cached --stat
            plugins=$(git diff --cached --name-only | cut -d/ -f1 | sort -u | sed 's/.*/- `&`/')
            (cd .github && plz run //scripts:registry -- bump --title "$TITLE" --base origin/main)
          fi
          echo "title=${TITLE}" >>"$GITHUB_OUTPUT"
          {
            echo "plugins<<EOF"
            echo "$plugins"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Get a GitHub App token, if one's configured
        id: app-token
        if: vars.NIGHTLY_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.NIGHTLY_APP_ID }}
          private-key: ${{ secrets.NIGHTLY_APP_PRIVATE_KEY }}

      # Opens (or updates) the pull request with whatever's changed - or, if
      # nothing has, deletes the branch, closing any pull request from a
      # previous night that's no longer needed.
      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: nightly/version-mirrors
          delete-branch: true
          base: main
          title: ${{ steps.bump.outputs.title }}
          commit-message: ${{ steps.bump.outputs.title }}
          body: |
            Newly published tool versions, from the checksum mirror scripts
            (`cd .github && plz run //scripts/mirrors:<tool>`), for:

            ${{ steps.bump.outputs.plugins }}

            with the patch version bump and `registry/` entry this title
            implies for each.

            Opened by the [Nightly workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) - the next run updates this pull request.
          labels: dependencies
