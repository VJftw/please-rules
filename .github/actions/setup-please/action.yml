name: Set up Please
description: Installs a pinned version of Please (https://please.build) as `plz`.

inputs:
  version:
    description: The Please version to install.
    default: "17.33.0"

runs:
  using: composite
  steps:
    - name: Install Please ${{ inputs.version }}
      shell: bash
      env:
        PLEASE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        dir="$HOME/.please/$PLEASE_VERSION"
        mkdir -p "$dir" "$HOME/.please/bin"
        curl -fsSL "https://get.please.build/linux_amd64/${PLEASE_VERSION}/please_${PLEASE_VERSION}.tar.gz" \
          | tar -xzf - --strip-components=1 -C "$dir"
        ln -sf "$dir/please" "$HOME/.please/bin/plz"
        echo "$HOME/.please/bin" >>"$GITHUB_PATH"
        "$HOME/.please/bin/plz" --version

    # Ubuntu 24.04 runners restrict unprivileged user namespaces, which
    # Please's test sandbox (`sandbox = True`) needs to unshare the network
    # and mount namespaces - without this it fails to start the test command.
    - name: Allow unprivileged user namespaces
      shell: bash
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
